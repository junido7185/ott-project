services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok === 1 ? quit(0) : quit(1)"]
      interval: 5s
      # Include mongosh startup time on CPU-emulated development hosts.
      timeout: 40s
      retries: 20
  web:
    build: .
    environment:
      PORT: '3000'
      MONGO_URI: mongodb://mongo:27017/ott
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET for local development}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
